name: Setup
description: pnpm, Node (from .nvmrc), Foundry and a frozen-lockfile install. Third-party actions are pinned to commit SHAs.
runs:
  using: composite
  steps:
    - uses: pnpm/action-setup@b906affcce14559ad1aafd4ab0e942779e9f58b1 # v4
    - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
      with:
        node-version-file: .nvmrc
        cache: pnpm
    - uses: foundry-rs/foundry-toolchain@908c540300062bd5a7e473851cdb4282204cee09 # v1
      # Pinned: forge fmt's style changes between releases, and `forge fmt --check` must agree with local runs.
      with:
        version: v1.3.2
    - run: pnpm install --frozen-lockfile
      shell: bash
