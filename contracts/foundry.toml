[profile.default]
src = "src"
out = "out"
test = "test"
script = "script"
libs = ["node_modules"]
solc_version = "0.8.30"
evm_version = "prague"
fs_permissions = [{ access = "read", path = "./test/fixtures" }, { access = "write", path = "./deployments" }]
optimizer = true
optimizer_runs = 10_000
remappings = [
  "@openzeppelin/contracts/=node_modules/@openzeppelin/contracts/",
  "forge-std/=node_modules/forge-std/src/",
]

[fuzz]
runs = 1024

[invariant]
runs = 128
depth = 64
fail_on_revert = true

[rpc_endpoints]
monad_testnet = "${MONAD_TESTNET_RPC_URL}"
monad_mainnet = "${MONAD_MAINNET_RPC_URL}"
